[build]
  publish = "public"
  command = "npm run build"

[build.environment]
  # The build runs on Node 14 (.nvmrc, required by Gatsby 3), but the
  # nodejs14.x Lambda runtime is retired and Netlify refuses to deploy
  # functions targeting it — pin the functions runtime separately.
  AWS_LAMBDA_JS_RUNTIME = "nodejs20.x"

[[plugins]]
package = 'netlify-plugin-contextual-env'
  [plugins.inputs]
  mode = 'suffix'

[[plugins]]
package = "@netlify/plugin-gatsby"
